name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: latest
          cache: npm
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run doctor -- --ci
      - run: npm run build
      - run: npm test
