<style>
  :root {
    color-scheme: light;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --color-text: #17324d;
    --color-text-muted: #537080;
    --color-accent: #176579;
    --color-accent-strong: #277c8e;
    --color-page: #f4f7f9;
    --color-surface: #fff;
    --color-on-accent: #fff;
    --color-border: #d5e1e7;
    --color-border-input: #9aafb9;
    --shadow-card: 0 0.75rem 2rem rgb(23 50 77 / 8%);
    color: var(--color-text);
    background: var(--color-page);
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-width: 320px; }
  .site-header {
    position: sticky;
    top: 0;
    z-index: 1;
    background: var(--color-surface);
    border-bottom: 1px solid var(--color-border);
  }
  .site-header-inner {
    width: min(100% - 2rem, 52rem);
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem 1.5rem;
    padding: 0.85rem 0;
  }
  .site-mark {
    color: var(--color-text);
    text-decoration: none;
    font-weight: 800;
    letter-spacing: 0.04em;
  }
  .site-header nav {
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem 1.15rem;
    margin: 0;
  }
  .site-header nav a[aria-current="page"] {
    color: var(--color-text);
    text-decoration: none;
    border-bottom: 2px solid var(--color-accent);
  }
  .site-shell { width: min(100% - 2rem, 52rem); margin: 0 auto; padding: 2.25rem 0 4rem; }
  .eyebrow { margin: 0 0 0.75rem; color: var(--color-accent-strong); font-size: 0.8rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
  h1 { margin: 0; font-size: clamp(1.85rem, 5vw, 2.75rem); line-height: 1.15; }
  h2 { margin-top: 0; }
  .intro { max-width: 40rem; margin: 1.25rem 0 1.75rem; font-size: 1.15rem; line-height: 1.6; }
  .stack { display: grid; gap: 1.25rem; }
  .card { padding: 1.5rem; border: 1px solid var(--color-border); border-radius: 1rem; background: var(--color-surface); box-shadow: var(--shadow-card); line-height: 1.6; }
  .card p:last-child, .card ol:last-child, .card .prompt:last-child { margin-bottom: 0; }
  a { color: var(--color-accent); font-weight: 700; cursor: pointer; }
  code {
    font-size: 0.92em;
    background: var(--color-page);
    padding: 0.12em 0.35em;
    border-radius: 0.25rem;
  }
  .prompt {
    margin: 1rem 0;
    padding: 0.9rem 1rem;
    border-left: 4px solid var(--color-accent);
    background: var(--color-page);
    border-radius: 0 0.5rem 0.5rem 0;
  }
  .prompt p { margin: 0; }
  ol { margin: 0.75rem 0 0; padding-left: 1.25rem; }
  ol li { margin: 0.45rem 0; }
  label, input { display: block; width: 100%; }
  label { margin-top: 1rem; font-weight: 700; }
  input { margin-top: 0.35rem; padding: 0.7rem; border: 1px solid var(--color-border-input); border-radius: 0.4rem; font: inherit; }
  button { margin-top: 1.5rem; padding: 0.7rem 1rem; border: 0; border-radius: 0.4rem; background: var(--color-accent); color: var(--color-on-accent); font: inherit; font-weight: 700; cursor: pointer; }
  button:disabled { opacity: 0.65; cursor: wait; }
  .guestbook-list { margin: 1rem 0 0; padding: 0; list-style: none; }
  .guestbook-list li { padding: 0.8rem 0; border-top: 1px solid var(--color-border); }
  .guestbook-list span { color: var(--color-text-muted); }
</style>
